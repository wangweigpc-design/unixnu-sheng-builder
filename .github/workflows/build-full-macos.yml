name: Build encrypted full-capacity macOS images

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-capacity-macos-build
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 360
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONUNBUFFERED: '1'
      JOBS: '2'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CARGO_BUILD_JOBS: '2'
      UNIXNU_IPSW_JOBS: '16'
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
      UNIXNU_LAB_PASSWORD: ${{ secrets.MACOS_TEMP_PASSWORD }}
      ARTIFACT_AGE_RECIPIENT: ${{ vars.ARTIFACT_AGE_RECIPIENT }}
      RUNTIME_CACHE_RELEASE: ${{ vars.RUNTIME_CACHE_RELEASE }}
      RUNTIME_CACHE_SHA256: ${{ vars.RUNTIME_CACHE_SHA256 }}
      RUNTIME_CACHE_AGE_IDENTITY: ${{ secrets.RUNTIME_CACHE_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/UniXNU
          ref: 21d683dff61c66f219f03ab9d8b9249026514788
          path: UniXNU
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/UniXNU-sheng
          ref: bc05635a483d69a6c51cafd44723372b66c941f3
          path: device
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: UniXNU/uefi-sheng
          ref: 8156d2e54a9f57818dc8b415a1a7dc28ad9ba4be
          path: uefi-sheng
          persist-credentials: false
      - name: Prepare pinned full-capacity settings
        run: python3 prepare_build.py
      - name: Install build and encryption tools
        run: |
          set -euo pipefail
          brew install age zstd
          brew install dtc llvm lld llvm@22 lld@22 cmake mtools ninja glslang shaderc spirv-tools bison pkgconf rustup unifdef openssl@3 blacktop/tap/ipsw
          {
            echo "$HOME/.cargo/bin"
            echo "/opt/homebrew/opt/bison/bin"
          } >> "$GITHUB_PATH"
          python3 - <<'PY'
          from pathlib import Path
          import os
          tools = Path('uefi-toolchain').resolve()
          tools.mkdir()
          for name in ('clang', 'llvm-lib', 'llvm-rc', 'lld-link'):
              package = 'lld@22' if name == 'lld-link' else 'llvm@22'
              (tools / name).symlink_to(Path('/opt/homebrew/opt') / package / 'bin' / name)
          with open(os.environ['GITHUB_ENV'], 'a') as handle:
              handle.write('CLANG_BIN=' + str(tools) + '/\n')
          PY
          rustup toolchain install 1.98.0 --profile minimal --component rust-src
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Restore optional authenticated runtime inputs
        run: python3 restore_runtime.py
      - name: Resolve sources and create fresh 210 GiB Data seed
        working-directory: UniXNU
        run: |
          set -euo pipefail
          ./unixnu defconfig sheng_macos_defconfig -D ../device --os macos-27
          ./unixnu fetch --os macos-27 2>&1 | tee ../reports/fetch.log
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from unixnu.cli import parser, prepare
          from unixnu.config import Context
          from unixnu.kernel import archive_plan
          ctx = Context(parser().parse_args(['build', 'kernel', '-D', '../device', '--os', 'macos-27']))
          prepare(ctx, ['kernel'])
          plan = archive_plan(ctx)
          report = [(kind, entry['id'] if kind == 'component' else entry) for kind, entry in plan]
          Path('../reports/archive-plan.json').write_text(json.dumps(report, indent=2) + '\n')
          print('Verified ordered macOS archive plan before expensive runtime compilation.')
          PY
          python3 ../device/scripts/prepare-macos-install.py 2>&1 | tee ../reports/prepare.log
          ./unixnu status --os macos-27 --json > ../reports/resolved-status.json
      - name: Build kernel, runtime and boot image
        id: boot
        working-directory: device
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee ../reports/build.log
          import json, subprocess
          from pathlib import Path
          command = ['scripts/package.sh', '--os', 'macos-27', '--uefi', '../uefi-sheng', '--no-deps']
          resume = Path('../reports/resume-options.json')
          if resume.is_file():
              options = json.loads(resume.read_text())
              for key, flag in [('data_ramdisk', '--data-ramdisk'), ('trust_cache', '--owner-trust-cache'), ('gpu_addon', '--gpu-addon')]:
                  command += [flag, options[key]]
          subprocess.run(command, check=True)
          PY
      - name: Build matching root image
        id: root
        working-directory: UniXNU
        run: |
          set -euo pipefail
          tree=out/sheng/macos-27.3-26C5035r/sheng_macos/tree
          ./unixnu build userdata --os macos-27 \
            --object "OS.vroot=$tree/build/verified-root-OS/hashes.bin" \
            --object "SystemOS.vroot=$tree/build/verified-root-SystemOS/hashes.bin" \
            --object "App.vroot=$tree/build/verified-root-App/hashes.bin" 2>&1 | tee ../reports/root.log
      - name: Verify and collect installation outputs
        id: collect
        run: python3 collect_outputs.py --success
      - name: Collect failure diagnostics
        if: failure()
        run: python3 collect_outputs.py
      - name: Encrypt installation outputs or failure diagnostics
        if: always()
        run: |
          set -euo pipefail
          test -d private-bundle
          command -v age
          command -v zstd
          tar -cf - -C private-bundle . | zstd -T2 -3 | age -r "$ARTIFACT_AGE_RECIPIENT" | python3 split_encrypted_stream.py
      - name: Publish encrypted release parts
        if: always()
        env:
          IMAGE_BUILD_SUCCESS: ${{ steps.collect.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -f encrypted-release/encrypted-manifest.json
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'Encrypted build bundle. Image build success: %s. Hardware validation has not been performed.\n' "$IMAGE_BUILD_SUCCESS" > release-notes.txt
          gh release create "$tag" encrypted-release/* --repo "$GITHUB_REPOSITORY" \
            --title "Encrypted macOS build ${GITHUB_RUN_ID}" --notes-file release-notes.txt
